    schemeSteps: ["Есептің шартын оқу","Деректерді жазу: m, t₁, t₂, c","Δt = t₂ − t₁ табу","Q = c·m·Δt формуласына қою және есептеу","Жауапты жазу"],
    calcTitle: "🔢 Есепті шығар",
    calcText: "2 кг суды 20 °C-тан 30 °C-қа дейін қыздыру үшін қанша жылу мөлшері қажет? Судың меншікті жылу сыйымдылығы c = 4200 Дж/(кг·°C). Жауапты джоульмен сан түрінде жаз.",
    calcPlaceholder: "Сан енгіз, мысалы 12500",
    calcAnswer: 84000,
    checkBtn: "Тексеру",
    hintBtn: "💡 Кеңес (−5%)",
    msgCorrect: "✅ Дұрыс! Тапсырма қабылданды.",
    msgWrong: "❌ Қате. Қайта көріп көр (−5%).",
    msgEmpty: "⚠️ Алдымен тапсырманы толық орында.",
    matchPartial: "❌ {n}/4 жұп дұрыс. Қателерді түзет (−5%).",
    testPartial: "❌ Дұрыс жауаптар: {n}/4. Қателерді түзет (−5%).",
    doneMark: "орындалды ✓",
    theoryHint: "Q = c·m·Δt. Судың жылу сыйымдылығы (4200) — кестедегі ең үлкені: су баяу қызады және баяу суиды.",
    puzzleHint: "Бірінші бос орын — Q әрпі, екінші — Q = c·m·Δt формуласы, үшінші — 4200, төртінші — «алады».",
    matchHint: "Q — Дж; c — Дж/(кг·°C); m — кг; Δt — °C.",
    testHint: "Жауаптар: 1) Q = c·m·Δt; 2) 4200; 3) береді; 4) джоуль (Дж).",
    schemeHint: "Реті: шарт → деректер (m, t₁, t₂, c) → Δt → формулаға қою → жауап.",
    calcHint: "Δt = 30 − 20 = 10 °C. Q = 4200 · 2 · 10 = 84 000 Дж.",
    noReset: "🔒 Нәтижелерді қалпына келтіру қарастырылмаған — прогресс пен ұпай автоматты сақталады.",
    finalTitle: "🎉 Барлық тапсырма орындалды!",
    finalLbl: "Қорытынды нәтижең",
    finalMsg: "Нәтиже сақталды және оны қалпына келтіру мүмкін емес.",
    closeBtn: "Тапсырмаларды қарау"
  }
};

var LS_KEY = "heat8_app_v4";
var S = {
  lang: "ru",
  score: 100,
  hints: {theory:false,puzzle:false,match:false,test:false,scheme:false,calc:false},
  done: {puzzle:false,match:false,test:false,scheme:false,calc:false},
  puzzleAns: [null,null,null,null],
  matchAns: {},
  testAns: {},
  schemeDisp: null,
  schemeOrder: [],
  matchDisp: null,
  testDisp: null,
  calcAns: "",
  allDone: false
};
var selWord = null;

function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var o = JSON.parse(raw);
      for(var k in o){ if(o.hasOwnProperty(k)) S[k]=o[k]; }
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function t(){ return T[S.lang]; }

function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function shuffleIdx(n){
  var a=[]; for(var i=0;i<n;i++) a.push(i);
  return shuffle(a);
}

function penalty(){
  S.score = Math.max(0, S.score-5);
  save();
}
function setFb(sec,ok,text){
  var f = el('fb-'+sec);
  f.className = 'fb show ' + (ok?'fb-ok':'fb-err');
  f.textContent = text;
}
function shakeCard(id){
  var c = el(id);
  c.classList.remove('shake');
  void c.offsetWidth;
  c.classList.add('shake');
}

function useHint(sec){
  if(S.hints[sec]) return;
  S.hints[sec] = true;
  penalty();
  renderAll();
}

function switchLang(){
  S.lang = (S.lang==='ru') ? 'kz' : 'ru';
  save();
  var fbs = document.querySelectorAll('.fb');
  for(var i=0;i<fbs.length;i++){ fbs[i].className='fb'; fbs[i].textContent=''; }
  renderAll();
}

function renderHint(sec){
  var L = t();
  var btn = el('hint-'+sec), box = el('hintbox-'+sec);
  var used = !!S.hints[sec];
  btn.textContent = used ? '💡 ✓' : L.hintBtn;
  btn.disabled = used || !!S.done[sec];
  box.textContent = L[sec+'Hint'];
  box.className = 'hintbox' + (used ? ' show' : '');
}

function renderPuzzleText(){
  var L = t();
  var html = L.puzzleText.replace(/\{(\d+)\}/g, function(m,d){
    var i = parseInt(d,10);
    var w = S.puzzleAns[i];
    var filled = (w!==null && w!==undefined);
    return "<span class='blank"+(filled?' filled':'')+"' onclick='blankClick("+i+")'>"+(filled?L.puzzleWords[w]:'•••')+"</span>";
  });
  el('puzzleText').innerHTML = html;
}

function renderPuzzleWords(){
  var L = t();
  var box = el('puzzleWords');
  box.innerHTML = '';
  for(var i=0;i<L.puzzleWords.length;i++){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (S.puzzleAns.indexOf(i)>-1?' used':'') + (selWord===i?' sel':'');
    b.textContent = L.puzzleWords[i];
    b.setAttribute('data-i', i);
    b.onclick = function(){ wordClick(parseInt(this.getAttribute('data-i'),10)); };
    box.appendChild(b);
  }
  if(S.done.puzzle) box.classList.add('locked-box'); else box.classList.remove('locked-box');
}

function wordClick(i){
  if(S.done.puzzle) return;
  if(S.puzzleAns.indexOf(i) > -1) return;
  selWord = (selWord===i) ? null : i;
  renderPuzzleWords();
}

function blankClick(i){
  if(S.done.puzzle) return;
  var cur = S.puzzleAns[i];
  if(selWord!==null){
    S.puzzleAns[i] = selWord;
    selWord = null;
  } else if(cur!==null && cur!==undefined){
    S.puzzleAns[i] = null;
  } else {
    return;
  }
  save();
  renderPuzzleText();
  renderPuzzleWords();
}

function checkPuzzle(){
  if(S.done.puzzle) return;
  var L = t(), i;
  for(i=0;i<4;i++){
    if(S.puzzleAns[i]===null || S.puzzleAns[i]===undefined){ setFb('puzzle',0,L.msgEmpty); return; }
  }
  var ok = true;
  for(i=0;i<4;i++){ if(S.puzzleAns[i]!==L.puzzleCorrect[i]) ok=false; }
  if(ok){
    S.done.puzzle = true; save(); renderAll();
    setFb('puzzle',1,L.msgCorrect); checkAll();
  } else {
    penalty(); renderAll();
    setFb('puzzle',0,L.msgWrong); shakeCard('puzzleCard');
  }
}

function renderMatch(){
  var L = t();
  var box = el('matchBox');
  box.innerHTML = '';
  for(var i=0;i<L.matchItems.length;i++){
    var row = document.createElement('div');
    row.className = 'mrow';
    var lab = document.createElement('span');
    lab.className = 'mlab';
    lab.textContent = L.matchItems[i];
    var sel = document.createElement('select');
    sel.className = 'msel';
    var ph = document.createElement('option');
    ph.value = ''; ph.textContent = '— ? —';
    sel.appendChild(ph);
    for(var k=0;k<S.matchDisp.length;k++){
      var oi = S.matchDisp[k];
      var op = document.createElement('option');
      op.value = String(oi);
      op.textContent = L.matchOptions[oi];
      sel.appendChild(op);
    }
    if(S.matchAns[i]!==undefined && S.matchAns[i]!=='') sel.value = String(S.matchAns[i]);
    sel.setAttribute('data-i', i);
    sel.onchange = function(){ S.matchAns[parseInt(this.getAttribute('data-i'),10)] = this.value; save(); };
    if(S.done.match) sel.disabled = true;
    row.appendChild(lab); row.appendChild(sel);
    box.appendChild(row);
  }
}

function checkMatch(){
  if(S.done.match) return;
  var L = t(), i;
  for(i=0;i<L.matchItems.length;i++){
    if(S.matchAns[i]===undefined || S.matchAns[i]===''){ setFb('match',0,L.msgEmpty); return; }
  }
  var cnt = 0;
  for(i=0;i<L.matchItems.length;i++){
    if(String(S.matchAns[i]) === String(L.matchCorrect[i])) cnt++;
  }
  if(cnt === L.matchItems.length){
    S.done.match = true; save(); renderAll();
    setFb('match',1,L.msgCorrect); checkAll();
  } else {
    penalty(); renderAll();
    setFb('match',0,L.matchPartial.replace('{n}',cnt)); shakeCard('matchCard');
  }
}

function renderTest(){
  var L = t();
  var box = el('testBox');
  box.innerHTML = '';
  for(var i=0;i<L.testQ.length;i++){
    var w = document.createElement('div');
    w.className = 'tq';
    var p = document.createElement('p');
    p.className = 'tqtext';
    p.textContent = (i+1) + '. ' + L.testQ[i].q;
    w.appendChild(p);
    for(var k=0;k<S.testDisp[i].length;k++){
      var oi = S.testDisp[i][k];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.textContent = L.testQ[i].o[oi];
      if(S.testAns[i] === oi) b.classList.add('sel');
      if(S.done.test && L.testQ[i].a === oi) b.classList.add('good');
      b.setAttribute('data-q', i);
      b.setAttribute('data-o', oi);
      b.onclick = function(){
        if(S.done.test) return;
        S.testAns[parseInt(this.getAttribute('data-q'),10)] = parseInt(this.getAttribute('data-o'),10);
        save(); renderTest();
      };
      w.appendChild(b);
    }
    box.appendChild(w);
  }
  if(S.done.test) box.classList.add('locked-box'); else box.classList.remove('locked-box');
}

function checkTest(){
  if(S.done.test) return;
  var L = t(), i, cnt = 0, answered = 0;
  for(i=0;i<L.testQ.length;i++){
    if(S.testAns[i]===undefined){ setFb('test',0,L.msgEmpty); return; }
    answered++;
    if(S.testAns[i] === L.testQ[i].a) cnt++;
  }
  if(cnt === L.testQ.length){
    S.done.test = true; save(); renderAll();
    setFb('test',1,L.msgCorrect); checkAll();
  } else {
    penalty(); renderAll();
    setFb('test',0,L.testPartial.replace('{n}',cnt)); shakeCard('testCard');
  }
}

function renderScheme(){
  var L = t();
  var box = el('schemeBox');
  box.innerHTML = '';
  for(var k=0;k<S.schemeDisp.length;k++){
    var idx = S.schemeDisp[k];
    var d = document.createElement('div');
    d.className = 'sitem';
    var pos = S.schemeOrder.indexOf(idx);
    if(pos > -1){
      d.classList.add('sel');
      d.innerHTML = "<span class='num'>"+(pos+1)+"</span><span>"+L.schemeSteps[idx]+"</span>";
    } else {
      d.innerHTML = "<span class='num empty'>?</span><span>"+L.schemeSteps[idx]+"</span>";
    }
    if(S.done.scheme) d.classList.add('frozen');
    d.setAttribute('data-i', idx);
    d.onclick = function(){
      if(S.done.scheme) return;
      var id = parseInt(this.getAttribute('data-i'),10);
      var p = S.schemeOrder.indexOf(id);
      if(p > -1) S.schemeOrder.splice(p,1); else S.schemeOrder.push(id);
      save(); renderScheme();
    };
    box.appendChild(d);
  }
}

function checkScheme(){
  if(S.done.scheme) return;
  var L = t();
  if(S.schemeOrder.length < L.schemeSteps.length){ setFb('scheme',0,L.msgEmpty); return; }
  var ok = true;
  for(var i=0;i<S.schemeOrder.length;i++){ if(S.schemeOrder[i]!==i) ok=false; }
  if(ok){
    S.done.scheme = true; save(); renderAll();
    setFb('scheme',1,L.msgCorrect); checkAll();
  } else {
    penalty();
    S.schemeOrder = [];
    save(); renderAll();
    setFb('scheme',0,L.msgWrong); shakeCard('schemeCard');
  }
}

function calcInput(v){
  S.calcAns = v;
  save();
}

function checkCalc(){
  if(S.done.calc) return;
  var L = t();
  var v = parseFloat(String(S.calcAns).replace(',','.'));
  if(isNaN(v)){ setFb('calc',0,L.msgEmpty); return; }
  if(Math.abs(v - L.calcAnswer) < 1){
    S.done.calc = true; save(); renderAll();
    setFb('calc',1,L.msgCorrect); checkAll();
  } else {
    penalty(); renderAll();
    setFb('calc',0,L.msgWrong); shakeCard('calcCard');
  }
}

function checkAll(){
  var d = S.done;
  if(d.puzzle && d.match && d.test && d.scheme && d.calc && !S.allDone){
    S.allDone = true;
    save();
    showOverlay();
  }
}
function showOverlay(){
  el('finalScore').textContent = S.score;
  el('overlay').classList.add('show');
}
function closeOverlay(){
  el('overlay').classList.remove('show');
}

function renderAll(){
  var L = t();
  document.documentElement.lang = S.lang;
  el('hdrTitle').textContent = L.appTitle;
  el('hdrSub').textContent = L.appSub;
  el('langBtn').textContent = L.langBtn;
  el('scoreLbl').textContent = L.scoreLbl;
  el('scoreVal').textContent = S.score;
  el('progLbl').textContent = L.progLbl;
  var n = (S.done.puzzle?1:0)+(S.done.match?1:0)+(S.done.test?1:0)+(S.done.scheme?1:0)+(S.done.calc?1:0);
  el('progVal').textContent = n + '/5';
  el('pfill').style.width = (n/5*100) + '%';

  el('theoryTitle').textContent = L.theoryTitle;
  el('theoryBox').innerHTML = L.theoryHTML;
  renderHint('theory');

  el('puzzleTitle').textContent = L.puzzleTitle + (S.done.puzzle ? ' · ' + L.doneMark : '');
  el('puzzleIntro').textContent = L.puzzleIntro;
  renderPuzzleText();
  renderPuzzleWords();
  el('check-puzzle').textContent = S.done.puzzle ? '✅' : L.checkBtn;
  el('check-puzzle').disabled = S.done.puzzle;
  renderHint('puzzle');
  el('puzzleCard').className = 'card' + (S.done.puzzle ? ' done' : '');

  el('matchTitle').textContent = L.matchTitle + (S.done.match ? ' · ' + L.doneMark : '');
  el('matchIntro').textContent = L.matchIntro;
  renderMatch();
  el('check-match').textContent = S.done.match ? '✅' : L.checkBtn;
  el('check-match').disabled = S.done.match;
  renderHint('match');
  el('matchCard').className = 'card' + (S.done.match ? ' done' : '');

  el('testTitle').textContent = L.testTitle + (S.done.test ? ' · ' + L.doneMark : '');
  renderTest();
  el('check-test').textContent = S.done.test ? '✅' : L.checkBtn;
  el('check-test').disabled = S.done.test;
  renderHint('test');
  el('testCard').className = 'card' + (S.done.test ? ' done' : '');

  el('schemeTitle').textContent = L.schemeTitle + (S.done.scheme ? ' · ' + L.doneMark : '');
  el('schemeIntro').textContent = L.schemeIntro;
  renderScheme();
  el('check-scheme').textContent = S.done.scheme ? '✅' : L.checkBtn;
  el('check-scheme').disabled = S.done.scheme;
  renderHint('scheme');
  el('schemeCard').className = 'card' + (S.done.scheme ? ' done' : '');

  el('calcTitle').textContent = L.calcTitle + (S.done.calc ? ' · ' + L.doneMark : '');
  el('calcText').textContent = L.calcText;
  el('calcIn').placeholder = L.calcPlaceholder;
  el('calcIn').value = S.calcAns;
  el('calcIn').disabled = S.done.calc;
  el('check-calc').textContent = S.done.calc ? '✅' : L.checkBtn;
  el('check-calc').disabled = S.done.calc;
  renderHint('calc');
  el('calcCard').className = 'card' + (S.done.calc ? ' done' : '');

  el('noReset').textContent = L.noReset;
  el('finalTitle').textContent = L.finalTitle;
  el('finalLbl').textContent = L.finalLbl;
  el('finalScore').textContent = S.score;
  el('finalMsg').textContent = L.finalMsg + ' ' + L.noReset;
  el('overlayClose').textContent = L.closeBtn;
}

load();
if(!S.schemeDisp || S.schemeDisp.length !== 5){
  var sd = shuffleIdx(5);
  if(sd[0]===0 && sd[1]===1 && sd[2]===2 && sd[3]===3 && sd[4]===4) sd = [2,0,4,1,3];
  S.schemeDisp = sd;
  save();
}
if(!S.matchDisp || S.matchDisp.length !== 6){ S.matchDisp = shuffleIdx(6); save(); }
if(!S.testDisp || S.testDisp.length !== 4){ S.testDisp = [shuffleIdx(4),shuffleIdx(4),shuffleIdx(4),shuffleIdx(4)]; save(); }

renderAll();
if(S.allDone) showOverlay();
</script>
</body>
</html>
